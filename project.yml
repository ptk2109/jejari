# XcodeGen 설정. Jejari.xcodeproj는 이 파일에서 생성한다 (`xcodegen generate`). 직접 고치지 않는다.
name: Jejari
options:
  bundleIdPrefix: com.nam24
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
packages:
  # 자동 업데이트
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.1"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Jejari:
    type: application
    platform: macOS
    sources:
      - Jejari
    dependencies:
      - package: Sparkle
    info:
      path: Jejari/Info.plist
      properties:
        CFBundleDisplayName: 제자리
        CFBundleShortVersionString: "0.5.1"
        CFBundleVersion: "6"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleEventsUsageDescription: 저장할 때 브라우저 창의 탭 주소를 읽어 불러올 때 다시 엽니다.
        # jejari://save?name=… 등 외부(스크립트, 단축어)에서 저장/불러오기를 부를 수 있게 한다
        CFBundleURLTypes:
          - CFBundleURLName: com.nam24.jejari
            CFBundleURLSchemes: [jejari]
        # 자동 업데이트 (Sparkle): 최신 GitHub Release의 appcast.xml을 하루에 한 번 확인한다.
        # 업데이트 파일은 SUPublicEDKey의 짝인 비밀 키로 서명한다 (docs/개발.md 버전 내기)
        SUFeedURL: https://github.com/ptk2109/jejari/releases/latest/download/appcast.xml
        SUPublicEDKey: zbmiG+KD5xsLb9/PuAxuAb1UejPPkQgMU20bjRWb+gc=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nam24.jejari
        PRODUCT_NAME: Jejari
        CODE_SIGN_STYLE: Automatic
        # 다른 앱의 창을 제어하고 비공개 API를 쓰므로 샌드박스를 쓰지 않는다 (기획서 7장)
        ENABLE_APP_SANDBOX: NO
        # 손쉬운 사용 권한을 가진 앱이라 다른 프로그램이 코드를 끼워 넣지 못하게 한다 (DYLD_INSERT_LIBRARIES 등)
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Jejari/Jejari.entitlements
        # 비공개 CGVirtualDisplay 선언 (Core/CGVirtualDisplay.h)
        SWIFT_OBJC_BRIDGING_HEADER: Jejari/Core/CGVirtualDisplay.h
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # 배포판에는 디버거 연결 허용(get-task-allow)을 넣지 않는다. 개발 인증서로 서명하면 Xcode가 자동으로 넣는다
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
